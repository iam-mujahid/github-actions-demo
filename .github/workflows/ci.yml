name: My First GitHub Actions Workflow

on:
  push:
    branches:
      - main

jobs:
  env:
    myName: abbas

  test:
    runs-on: ubuntu-latest
    env:
      name: mujahid

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test
        run: echo "Running tests by $name ..."

      #- name: test check 
       # run: exit 1

      - name: Test successful
        run: echo "Tests passed!"
    

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build
        run: echo "Building application by $myName..."

      - name: Build successful
        run: echo "Build completed!"
